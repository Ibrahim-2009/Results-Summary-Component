<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card">
      <section class="left-side">
        <h1 class="result">Your Result</h1>
        <div class="circle">
          <p class="num">76</p>
          <p class="of-num">of 100</p>
        </div>
        <h2 class="great">Great</h2>
        <p class="para">You scored higher than 65% of the people who have taken these tests.</p>
      </section>
      <section class="right-side">
        <h3 class="summary">Summary</h3>
        <ul class="divs">
          <li class="holder red">
            <img src="images/icon-reaction.svg" alt="Reaction icon">
            <span class="main reaction">Reaction</span>
            <span class="num-result">80</span>
            <span class="num-of">/ 100</span>
          </li>
          <li class="holder orangey">
            <img src="images/icon-memory.svg" alt="Memory icon">
            <span class="main memory">Memory</span>
            <span class="num-result">92</span>
            <span class="num-of">/ 100</span>
          </li>
          <li class="holder green">
            <img src="images/icon-verbal.svg" alt="Verbal icon">
            <span class="main verbal">Verbal</span>
            <span class="num-result">61</span>
            <span class="num-of">/ 100</span>
          </li>
          <li class="holder blue">
            <img src="images/icon-visual.svg" alt="Visual icon">
            <span class="main visual">Visual</span>
            <span class="num-result">73</span>
            <span class="num-of">/ 100</span>
          </li>
        </ul>
        <button class="btn">Continue</button>
      </section>
    </article>
  </main>
</body>
</html>
